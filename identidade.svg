<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-kerning="normal">
  <title>Afegue Barbearia — Identidade Visual</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0b1730"/>
      <stop offset="55%" stop-color="#070d1d"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f9e7ae"/>
      <stop offset="35%"  stop-color="#e0b75a"/>
      <stop offset="65%"  stop-color="#c08f2f"/>
      <stop offset="100%" stop-color="#f2d488"/>
    </linearGradient>

    <linearGradient id="goldLine" gradientUnits="userSpaceOnUse" x1="340" y1="0" x2="884" y2="0">
      <stop offset="0%"   stop-color="#c08f2f" stop-opacity="0.15"/>
      <stop offset="14%"  stop-color="#e7c268" stop-opacity="1"/>
      <stop offset="86%"  stop-color="#e7c268" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c08f2f" stop-opacity="0.15"/>
    </linearGradient>

    <radialGradient id="sealFill" cx="50%" cy="35%" r="75%">
      <stop offset="0%"   stop-color="#132445"/>
      <stop offset="100%" stop-color="#060c1a"/>
    </radialGradient>

    <pattern id="pinstripe" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="none"/>
      <rect width="1" height="14" fill="#ffffff" opacity="0.035"/>
    </pattern>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="arcTop" d="M 105,315 A 90,90 0 0 1 285,315"/>
    <path id="arcBottom" d="M 103,315 A 92,92 0 0 0 287,315"/>
  </defs>

  <!-- ================= FUNDO ================= -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#pinstripe)"/>
  <rect x="26" y="26" width="1148" height="578" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.85"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.14"/>

  <!-- ================= SELO CIRCULAR (esquerda) ================= -->
  <g>
    <circle cx="195" cy="315" r="131" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <circle cx="195" cy="315" r="123" fill="url(#sealFill)" stroke="#c08f2f" stroke-width="1" opacity="0.98"/>
    <circle cx="195" cy="315" r="110" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.9"/>
    <circle cx="195" cy="315" r="76"  fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.18"/>

    <!-- texto no anel -->
    <text font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="4.5"
          fill="url(#gold)" text-anchor="middle">
      <textPath href="#arcTop" startOffset="50%">AFEGUE BARBEARIA</textPath>
    </text>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="5"
          fill="#f4f6fa" text-anchor="middle" opacity="0.85">
      <textPath href="#arcBottom" startOffset="50%">CLÁSSICO · TRADIÇÃO</textPath>
    </text>

    <!-- monograma AB -->
    <g filter="url(#softGlow)">
      <text x="195" y="302" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold"
            letter-spacing="2" fill="url(#gold)">AB</text>
    </g>

    <!-- navalhas cruzadas -->
    <g transform="translate(195,348)">
      <g transform="rotate(-32) scale(0.42) translate(-4,0)">
        <path d="M-80,-7 h74 a6,6 0 0 1 0,14 h-74 a7,7 0 0 1 0,-14 z" fill="#0a1122" stroke="url(#gold)" stroke-width="5"/>
        <path d="M-4,-9 L62,-13 L80,0 L62,12 L-4,9 Z" fill="#dfe6f2" stroke="#9fb0cc" stroke-width="3"/>
        <path d="M-4,6 L64,8" stroke="#8b9ab5" stroke-width="3"/>
        <circle cx="-70" cy="0" r="4" fill="url(#gold)"/>
      </g>
      <g transform="rotate(32) scale(0.42) translate(4,0)">
        <path d="M80,-7 h-74 a6,6 0 0 0 0,14 h74 a7,7 0 0 0 0,-14 z" fill="#0a1122" stroke="url(#gold)" stroke-width="5"/>
        <path d="M4,-9 L-62,-13 L-80,0 L-62,12 L4,9 Z" fill="#dfe6f2" stroke="#9fb0cc" stroke-width="3"/>
        <path d="M4,6 L-64,8" stroke="#8b9ab5" stroke-width="3"/>
        <circle cx="70" cy="0" r="4" fill="url(#gold)"/>
      </g>
      <path d="M-16,-16 L0,0 L16,-16" fill="none" stroke="#c0202f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    </g>

    <!-- estrelas laterais do selo -->
    <circle cx="76" cy="315" r="3.5" fill="#c0202f"/>
    <circle cx="314" cy="315" r="3.5" fill="#c0202f"/>
  </g>

  <!-- ================= BLOCO CENTRAL ================= -->
  <g text-anchor="middle">

    <!-- coroa -->
    <g transform="translate(612,124)" fill="url(#gold)">
      <path d="M-48,20 L-48,-4 L-25,11 L0,-25 L25,11 L48,-4 L48,20 Z"/>
      <rect x="-53" y="22" width="106" height="11" rx="3"/>
      <circle cx="-48" cy="-10" r="5.5"/>
      <circle cx="0"   cy="-31" r="6.5"/>
      <circle cx="48"  cy="-10" r="5.5"/>
      <circle cx="0"   cy="27.5" r="3" fill="#c0202f"/>
      <circle cx="-30" cy="27.5" r="2.5" fill="#c0202f"/>
      <circle cx="30"  cy="27.5" r="2.5" fill="#c0202f"/>
    </g>

    <!-- nome -->
    <text x="612" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="98"
          font-weight="bold" letter-spacing="7" fill="#ffffff">AFEGUE</text>

    <!-- linha dourada + BARBEARIA + linhas decorativas -->
    <g transform="translate(612,0)">
      <line x1="-240" y1="298" x2="-176" y2="298" stroke="url(#goldLine)" stroke-width="2"/>
      <line x1="176"  y1="298" x2="240"  y2="298" stroke="url(#goldLine)" stroke-width="2"/>
      <path d="M-166,298 l-9,-5 l9,-5 l9,5 z" fill="#c08f2f"/>
      <path d="M166,298 l-9,-5 l9,-5 l9,5 z"  fill="#c08f2f"/>
      <text x="0" y="307" font-family="Georgia, 'Times New Roman', serif" font-size="35"
            letter-spacing="15" fill="url(#gold)">BARBEARIA</text>

      <line x1="-190" y1="340" x2="190" y2="340" stroke="#ffffff" stroke-width="1" opacity="0.22"/>
      <text x="0" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16"
            letter-spacing="8" fill="#e9edf5" opacity="0.82">CORTE · BARBA · ESTILO</text>

      <!-- selo vermelho decorativo -->
      <path d="M0,404 l10,0 l6,7 l-6,7 l-10,0 l-6,-7 z" fill="#c0202f"/>
      <line x1="-160" y1="411" x2="-24" y2="411" stroke="url(#goldLine)" stroke-width="1.6"/>
      <line x1="24"   y1="411" x2="160" y2="411" stroke="url(#goldLine)" stroke-width="1.6"/>
    </g>
  </g>

  <!-- ================= CONTATO (direita) ================= -->
  <g>
    <line x1="866" y1="200" x2="866" y2="430" stroke="url(#gold)" stroke-width="1.6" opacity="0.8"/>

    <text x="1140" y="232" text-anchor="end" font-family="Georgia, 'Times New Roman', serif"
          font-size="15" letter-spacing="7" fill="url(#gold)">CONTATO</text>
    <line x1="946" y1="248" x2="1140" y2="248" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

    <!-- telefone -->
    <g transform="translate(886,286)">
      <circle r="18" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.75"/>
      <g transform="scale(0.68) translate(-12,-12)" fill="#ffffff">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.1 21 3 12.9 3 3c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
      </g>
    </g>
    <text x="1140" y="293" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
          font-size="24" letter-spacing="1.5" fill="#ffffff">+244 923 000 000</text>
    <text x="1140" y="315" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
          font-size="13" letter-spacing="3.5" fill="#9fb0cc">AGENDE O SEU HORÁRIO</text>

    <!-- instagram -->
    <g transform="translate(886,358)">
      <circle r="18" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.75"/>
      <g transform="scale(0.68) translate(-12,-12)" stroke="#ffffff" stroke-width="2.2" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="5.5"/>
        <circle cx="12" cy="12" r="4.3"/>
        <circle cx="17.3" cy="6.7" r="1.3" fill="#ffffff" stroke="none"/>
      </g>
    </g>
    <text x="1140" y="367" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
          font-size="24" letter-spacing="1.5" fill="#ffffff">@afeguebarbearia</text>
    <text x="1140" y="389" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
          font-size="13" letter-spacing="3.5" fill="#9fb0cc">SIGA-NOS</text>

    <line x1="946" y1="414" x2="1140" y2="414" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    <text x="1140" y="437" text-anchor="end" font-family="Arial, Helvetica, sans-serif"
          font-size="13" letter-spacing="4" fill="#c0202f">ABERTO · SEG — SÁB</text>
  </g>

  <!-- rodapé -->
  <line x1="60" y1="560" x2="1140" y2="560" stroke="#c08f2f" stroke-width="1.2" opacity="0.45"/>
  <text x="600" y="584" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="12" letter-spacing="6" fill="#8493ab">AFEGUE BARBEARIA · TRADIÇÃO EM CADA CORTE</text>
</svg>
