<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Selo Afegue Barbearia">
  <title>Afegue Barbearia</title>
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9e7ae"/>
      <stop offset="35%" stop-color="#e0b75a"/>
      <stop offset="65%" stop-color="#c08f2f"/>
      <stop offset="100%" stop-color="#f2d488"/>
    </linearGradient>
    <radialGradient id="fundo" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#1b1f27"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>
    <linearGradient id="aco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6fa"/>
      <stop offset="50%" stop-color="#c8ced8"/>
      <stop offset="100%" stop-color="#949aa6"/>
    </linearGradient>
    <filter id="brilho" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="arcoTopo" d="M 112,200 A 88,88 0 0 1 288,200"/>
    <path id="arcoBase" d="M 110,200 A 90,90 0 0 0 290,200"/>
  </defs>

  <!-- anéis -->
  <circle cx="200" cy="200" r="148" fill="none" stroke="url(#ouro)" stroke-width="4"/>
  <circle cx="200" cy="200" r="140" fill="url(#fundo)" stroke="#c08f2f" stroke-width="1.2"/>
  <circle cx="200" cy="200" r="124" fill="none" stroke="url(#ouro)" stroke-width="2"
          stroke-dasharray="2 8" stroke-linecap="round" opacity="0.9"/>
  <circle cx="200" cy="200" r="86" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.14"/>

  <!-- texto do anel -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="4.5"
        fill="url(#ouro)" text-anchor="middle">
    <textPath href="#arcoTopo" startOffset="50%">AFEGUE BARBEARIA</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="14.5" letter-spacing="5"
        fill="#dfe4ec" text-anchor="middle" opacity="0.88">
    <textPath href="#arcoBase" startOffset="50%">CLÁSSICO · TRADIÇÃO</textPath>
  </text>

  <!-- monograma -->
  <g filter="url(#brilho)">
    <text x="200" y="185" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="bold"
          letter-spacing="2" fill="url(#ouro)">AB</text>
  </g>

  <!-- navalhas cruzadas -->
  <g transform="translate(200,234) scale(0.45)">
    <g transform="rotate(-32) scale(0.42) translate(-4,0)">
      <path d="M-80,-7 h74 a6,6 0 0 1 0,14 h-74 a7,7 0 0 1 0,-14 z" fill="#0a1122" stroke="url(#ouro)" stroke-width="5"/>
      <path d="M-4,-9 L62,-13 L80,0 L62,12 L-4,9 Z" fill="url(#aco)" stroke="#9fb0cc" stroke-width="3"/>
      <path d="M-4,6 L64,8" stroke="#8b9ab5" stroke-width="3"/>
      <circle cx="-70" cy="0" r="4" fill="url(#ouro)"/>
    </g>
    <g transform="rotate(32) scale(0.42) translate(4,0)">
      <path d="M80,-7 h-74 a6,6 0 0 0 0,14 h74 a7,7 0 0 0 0,-14 z" fill="#0a1122" stroke="url(#ouro)" stroke-width="5"/>
      <path d="M4,-9 L-62,-13 L-80,0 L-62,12 L4,9 Z" fill="url(#aco)" stroke="#9fb0cc" stroke-width="3"/>
      <path d="M4,6 L-64,8" stroke="#8b9ab5" stroke-width="3"/>
      <circle cx="70" cy="0" r="4" fill="url(#ouro)"/>
    </g>
  </g>

  <!-- detalhes vermelhos -->
  <circle cx="64" cy="200" r="5" fill="#d81f2a"/>
  <circle cx="336" cy="200" r="5" fill="#d81f2a"/>
</svg>
